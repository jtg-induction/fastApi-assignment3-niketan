[project]
name = "assignment-3"
version = "0.1.0"
description = "FastAPI Food Delivery Architecture Backend"
readme = "README.md"
authors = [
    { name = "niketangoyal-jtg", email = "niketan.goyal@joshtechnologygroup.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.159.1",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.0.55",
    "psycopg2-binary>=2.9.13",
    "alembic>=1.20.1",
    "python-dotenv>=1.2.4",
    "pydantic-settings>=2.15.0",
    "pre-commit>=4.6.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["UP", "I"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
