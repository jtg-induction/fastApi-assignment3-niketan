[project]
name = "assignment-3"
version = "0.1.0"
description = "FastAPI Food Delivery Architecture Backend"
readme = "README.md"
authors = [
    { name = "niketangoyal-jtg", email = "niketan.goyal@joshtechnologygroup.com" }
]
requires-python = ">=3.13"
dependencies = [
 "fastapi[standard]>=0.162.0",
 "pre-commit>=4.6.2",
 "psycopg[binary]>=3.3.6",
 "pwdlib[argon2]>=0.3.1",
 "pyjwt>=2.15.1",
 "sqlalchemy>=2.0.55",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F",  "E",  "W",  "I",  "UP", "B",  "SIM","RUF"]

ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
